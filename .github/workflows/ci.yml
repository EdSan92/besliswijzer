name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DATABASE_URL: postgresql://decision:decision@localhost:5432/besliswijzer
  ADMIN_API_KEY: ci-admin-key
  JWT_SECRET: ci-jwt-secret
  INSTALL_SECRET: ci-install-secret
  GEMINI_API_KEY: ci-placeholder
  GOOGLE_KEYWORD_INSIGHT_MOCK: 'true'

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: decision
          POSTGRES_PASSWORD: decision
          POSTGRES_DB: besliswijzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decision -d besliswijzer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests
        run: pnpm test:e2e
